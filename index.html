<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>가계부</title>
<!--
  읽기 전용 가계부 대시보드 (외부 정적 페이지)
  주소: index.html#u=<Apps Script 배포 ID>&k=<VIEW_TOKEN>[&m=YYYY-MM]
  - u·k 는 # 뒤에만 둔다 → 이 페이지를 올린 호스팅 서버로 전송되지 않고, 저장소에도 들어가지 않는다
  - 운영 웹앱의 ?view=dashdata (Dashboard.gs) 가 돌려준 화면 조각(서버에서 이스케이프)과 데이터를 그린다
  - 이 페이지에는 비밀값이 없다
  - 안드로이드 설치형 웹앱: 매니페스트의 시작 주소에는 # 이 없으므로, 주소로 한 번 연 u·k 를 이 기기에 보관해 두고 쓴다
    (아이폰은 홈 화면에 추가할 때의 주소를 그대로 쓰므로 매니페스트를 붙이지 않는다)
-->
<style>
:root{--bg:#F2F4F6;--text:#191F28;--mute:#8B95A1;--accent:#0FA37F}
@media (prefers-color-scheme:dark){:root{--bg:#0F1013;--text:#ECEDEF;--mute:#7D848D;--accent:#2ED3A3}}
html,body{background:var(--bg);color:var(--text)}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#state{text-align:center;padding:120px 24px;color:var(--mute)}
#state h2{color:var(--text);font-size:20px;margin:12px 0 6px}
#state .emoji{font-size:44px}
.spin{width:28px;height:28px;margin:0 auto;border:3px solid color-mix(in srgb,var(--mute) 30%,transparent);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#sync{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:9;display:none;
  align-items:center;gap:8px;padding:6px 12px;border-radius:20px;font-size:13px;color:var(--mute);
  background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#sync.on{display:flex}#sync .spin{width:12px;height:12px;border-width:2px;margin:0}
/* 수기 등록 */
#fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));z-index:8;display:none;
  width:60px;height:60px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;line-height:1;
  box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
#fab.on{display:block}
#sheet{position:fixed;inset:0;z-index:10;display:none;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .panel{box-sizing:border-box;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface,#fff);
  border-radius:24px 24px 0 0;padding:22px 20px max(20px,env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center}
#tabs{display:flex;gap:6px;background:var(--alt,#F7F8FA);border-radius:12px;padding:4px;margin-bottom:6px}
#tabs button{flex:1;border:0;background:none;color:var(--sub,var(--mute));font:inherit;font-size:15px;padding:9px;border-radius:9px;cursor:pointer}
#tabs button.on{background:var(--surface,#fff);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#del[hidden],#entry[hidden]{display:none}
#del .mnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 8px;font-weight:700;font-size:17px}
#del .mnav button{border:0;background:none;color:var(--sub,var(--mute));font-size:26px;padding:0 10px;cursor:pointer}
#dlist{margin-top:8px}
.drow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-top:1px solid var(--line,#E5E8EB)}
.drow .info{flex:1;min-width:0}
.drow .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .s{font-size:13px;color:var(--mute)}
.drow .a{font-weight:700;white-space:nowrap}
.drow button{border:1px solid var(--danger,#F04452);color:var(--danger,#F04452);background:none;border-radius:10px;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer}
.drow button:disabled{opacity:.4}
#dmsg{min-height:20px;margin:10px 0 0;font-size:14px;color:var(--danger,#F04452)}#dmsg.ok{color:var(--accent)}
.dempty{padding:28px 0;text-align:center;color:var(--mute)}
#sheet h3 button{margin-left:auto;border:0;background:none;color:var(--mute);font-size:26px;cursor:pointer;padding:0 4px}
#sheet label{display:block;font-size:14px;color:var(--sub,var(--mute));margin:14px 0 6px}
#sheet input,#sheet select{box-sizing:border-box;width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--alt,#F7F8FA);
  border:1px solid var(--line,#E5E8EB);border-radius:12px;padding:12px 14px;-webkit-appearance:none;appearance:none}
#sheet input:focus,#sheet select:focus{outline:2px solid var(--accent);outline-offset:-1px}
#cats{display:flex;flex-wrap:wrap;gap:8px}
#cats button{font:inherit;font-size:15px;border:1px solid var(--line,#E5E8EB);background:var(--alt,#F7F8FA);color:var(--text);
  border-radius:20px;padding:8px 14px;cursor:pointer}
#cats button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
#msg{min-height:20px;margin:14px 0 0;font-size:14px;color:var(--danger,#F04452)}
#msg.ok{color:var(--accent)}
#save{width:100%;margin-top:10px;border:0;border-radius:14px;padding:15px;font:inherit;font-size:17px;font-weight:700;
  background:var(--accent);color:#fff;cursor:pointer}
#save:disabled{opacity:.5}
</style>
<style id="dash-css"></style>
</head>
<body>
<div id="sync"><div class="spin"></div><span>최신 값 불러오는 중</span></div>
<main id="main"></main>
<div id="state"><div class="spin"></div><p>불러오는 중…</p></div>
<button id="fab" type="button" aria-label="수기 등록·삭제">+</button>
<div id="sheet">
 <div class="panel">
  <h3>수기 등록<button type="button" id="close" aria-label="닫기">×</button></h3>
  <div id="tabs"><button type="button" data-tab="entry" class="on">등록</button><button type="button" data-tab="del">삭제</button></div>
  <form id="entry" autocomplete="off">
    <label>카테고리</label>
    <div id="cats"></div>
    <label for="f-item">품목</label>
    <input id="f-item" maxlength="60" placeholder="예: 시장 반찬" required>
    <label for="f-amount">금액 (원)</label>
    <input id="f-amount" inputmode="numeric" placeholder="예: 12,000" required>
    <label for="f-pay">결제수단</label>
    <select id="f-pay"></select>
    <label for="f-date">날짜</label>
    <input id="f-date" type="date" required>
    <p id="msg"></p>
    <button id="save" type="submit">등록</button>
  </form>
  <div id="del" hidden>
    <div class="mnav"><button type="button" id="dprev" aria-label="이전 달">‹</button><span id="dmonth"></span><button type="button" id="dnext" aria-label="다음 달">›</button></div>
    <input id="dq" type="search" placeholder="품목·결제수단·금액 검색">
    <p id="dmsg"></p>
    <div id="dlist"></div>
  </div>
 </div>
</div>
<script>
(function () {
  var main = document.getElementById("main"), state = document.getElementById("state");
  var css = document.getElementById("dash-css"), sync = document.getElementById("sync");
  var seq = 0;

  var CONN = "dash:conn";
  function params() {
    var o = {};
    location.hash.replace(/^#/, "").split("&").forEach(function (kv) {
      var i = kv.indexOf("=");
      if (i > 0) o[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    try {
      var c = JSON.parse(localStorage.getItem(CONN)) || {};
      if (o.k && (o.u || o.api)) { c.u = o.u; c.k = o.k; c.api = o.api; }
      else { o.u = c.u; o.k = c.k; o.api = c.api; }
      // 등록 키(w)는 처음 받은 주소에만 있다 → 이후 월 이동 주소에는 넣지 않고 기기에 보관한 값을 쓴다
      if (o.w) c.w = o.w; else o.w = c.w;
      localStorage.setItem(CONN, JSON.stringify(c));
    } catch (e) {}
    return o;
  }

  if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) {
    var mf = document.createElement("link");
    mf.rel = "manifest"; mf.href = "manifest.webmanifest";
    document.head.appendChild(mf);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  }
  function hashOf(o) {
    return "#" + ["u", "k", "m", "api"].filter(function (n) { return o[n]; })
      .map(function (n) { return n + "=" + encodeURIComponent(o[n]); }).join("&");
  }
  function show(emoji, title, msg) {
    state.textContent = "";
    var e = document.createElement("div"); e.className = "emoji"; e.textContent = emoji;
    var h = document.createElement("h2"); h.textContent = title;
    var p = document.createElement("p"); p.textContent = msg;
    state.appendChild(e); state.appendChild(h); state.appendChild(p);
    state.style.display = "";
  }
  function apiUrl(p) {
    // 로컬 시험용: api=http://127.0.0.1:포트/exec 만 허용
    if (p.api && /^http:\/\/(127\.0\.0\.1|localhost):\d+\/exec$/.test(p.api)) return p.api;
    if (/^[A-Za-z0-9_-]{20,}$/.test(p.u || "")) return "https://script.google.com/macros/s/" + p.u + "/exec";
    return null;
  }

  // 마지막으로 받은 화면을 이 기기에 보관 → 다음에 열 때 즉시 표시 (보기 키는 저장하지 않음)
  function cacheKey(p, month) { return "dash:" + (p.u || p.api) + ":" + (month || "cur"); }
  function cacheGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function cachePut(k, res) { try { localStorage.setItem(k, JSON.stringify({ at: Date.now(), res: res })); } catch (e) {} }
  function fetchData(api, p, month) {
    var q = api + "?view=dashdata&k=" + encodeURIComponent(p.k) + (month ? "&m=" + encodeURIComponent(month) : "");
    return fetch(q, { cache: "no-store" }).then(function (r) { return r.json(); });
  }

  function render(res, keepScroll) {
    state.style.display = "none";
    if (res.css) css.textContent = res.css;
    document.title = "가계부 " + Number(String(res.month).slice(5)) + "월";
    var y = window.scrollY;
    main.innerHTML = res.body; // 서버(Dashboard.gs)에서 이스케이프한 조각, 스크립트 없음
    if (res.script && res.data) {
      window.DATA = res.data;
      var s = document.createElement("script");
      s.textContent = res.script; // 내역 목록: textContent 로만 그림
      document.body.appendChild(s);
      s.remove();
    }
    window.scrollTo(0, keepScroll ? y : 0);
  }

  // 이전 달을 미리 받아 두면 ‹ 를 눌렀을 때 바로 보인다 (5분 안에 받은 것이 있으면 생략)
  function prefetch(api, p, month) {
    var k = cacheKey(p, month), c = cacheGet(k);
    if (c && Date.now() - c.at < 5 * 60 * 1000) return;
    fetchData(api, p, month).then(function (res) { if (res.ok) cachePut(k, res); }).catch(function () {});
  }
  function prevMonth(m) {
    var y = Number(m.slice(0, 4)), n = Number(m.slice(5)) - 1;
    if (n < 1) { n = 12; y--; }
    return y + "-" + (n < 10 ? "0" : "") + n;
  }

  function load(isRefresh) {
    var p = params();
    var api = apiUrl(p);
    fab.className = p.w ? "on" : "";
    // 등록 키는 기기에 보관했으므로 주소창·방문 기록에서 지운다.
    // 아이폰은 홈 화면 앱이 Safari 와 저장소를 따로 쓰고 "홈 화면에 추가" 때의 주소로 열리므로 남겨 둔다
    if (/[#&]w=/.test(location.hash) && !/iPhone|iPad|iPod/.test(navigator.userAgent)) history.replaceState(null, "", hashOf(p));
    if (!api || !p.k) { main.textContent = ""; show("🔒", "주소를 확인하세요", "주소의 # 뒤에 u(배포 ID)와 k(보기 키)가 있어야 합니다."); return; }
    var my = ++seq;
    var k = cacheKey(p, p.m), cached = cacheGet(k);
    if (cached && cached.res && !isRefresh) render(cached.res, false);
    else if (!main.firstChild) state.style.display = "";
    sync.className = main.firstChild ? "on" : "";
    fetchData(api, p, p.m)
      .then(function (res) {
        if (my !== seq) return;
        sync.className = "";
        if (!res.ok) { main.textContent = ""; show("🔒", "접근할 수 없습니다", res.message || "보기 키를 확인하세요."); return; }
        cachePut(k, res);
        render(res, !!cached || isRefresh);
        prefetch(api, p, prevMonth(res.month));
      })
      .catch(function (err) {
        if (my !== seq) return;
        sync.className = "";
        if (!main.firstChild) show("⚠️", "불러오지 못했습니다", "인터넷 연결을 확인하고 다시 열어 주세요. (" + err.message + ")");
      });
  }

  // 월 이동 링크(#m=YYYY-MM): u·k 를 유지한 채 m 만 바꾼다
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href^="#m="]');
    if (!a) return;
    ev.preventDefault();
    var p = params();
    p.m = a.getAttribute("href").slice(3);
    location.hash = hashOf(p);
  });
  // ── 수기 등록: 등록 키(w)가 있는 기기에서만 + 버튼 표시. 저장은 운영 웹앱 doPost {"entry":1} (Entry.gs) ──
  var fab = document.getElementById("fab"), sheet = document.getElementById("sheet"), form = document.getElementById("entry");
  var cats = document.getElementById("cats"), fItem = document.getElementById("f-item"), fAmount = document.getElementById("f-amount");
  var fPay = document.getElementById("f-pay"), fDate = document.getElementById("f-date");
  var msg = document.getElementById("msg"), saveBtn = document.getElementById("save");
  var entryCat = "", txId = "", busy = false;

  function entryPost(action, payload) {
    var p = params(), api = apiUrl(p);
    // 본문이 text/plain 이면 사전 확인(CORS preflight) 없이 보낼 수 있다. 서버는 본문 JSON 만 읽는다
    return fetch(api, { method: "POST", body: JSON.stringify({ entry: 1, k: p.w, action: action, payload: payload || {} }) })
      .then(function (r) { return r.json(); });
  }
  function newTxId() {
    return "web-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  }
  function setMsg(text, ok) { msg.textContent = text; msg.className = ok ? "ok" : ""; }
  function pickCat(name) {
    entryCat = name;
    Array.prototype.forEach.call(cats.children, function (b) { b.classList.toggle("on", b.dataset.name === name); });
  }
  function fillConfig(c) {
    cats.textContent = "";
    c.categories.forEach(function (x) {
      var b = document.createElement("button");
      b.type = "button"; b.dataset.name = x.name; b.textContent = x.icon + " " + x.name;
      b.onclick = function () { pickCat(x.name); };
      cats.appendChild(b);
    });
    fPay.textContent = "";
    ["완료"].concat(c.payments.filter(function (x) { return x !== "완료"; })).forEach(function (x) {
      var o = document.createElement("option"); o.value = o.textContent = x; fPay.appendChild(o);
    });
    try { localStorage.setItem("entry:config", JSON.stringify(c)); } catch (e) {}
  }
  function today() {
    var d = new Date(Date.now() + 9 * 3600 * 1000); // 서울 기준
    return d.toISOString().slice(0, 10);
  }
  function openEntry() {
    if (!txId) {
      txId = newTxId();
      form.reset(); pickCat(""); fDate.value = today(); setMsg("");
    }
    sheet.className = "on";
    try { var c = JSON.parse(localStorage.getItem("entry:config")); if (c && !cats.firstChild) fillConfig(c); } catch (e) {}
    entryPost("config").then(function (r) {
      if (!r.ok) { setMsg(r.code === "DENIED" ? "등록 키가 맞지 않습니다. 등록 주소로 다시 열어 주세요." : r.message); return; }
      var keepPay = fPay.value, keepCat = entryCat;
      fillConfig(r.data);
      pickCat(keepCat); if (keepPay) fPay.value = keepPay;
    }).catch(function () { if (!cats.firstChild) setMsg("인터넷 연결을 확인해 주세요."); });
  }
  function closeEntry() { if (!busy) sheet.className = ""; }

  // ── 삭제 탭: 그 달 내역에서 골라 지운다 (서버는 화면에서 본 값과 시트 값이 같을 때만 그 행 4칸을 비움) ──
  var del = document.getElementById("del"), dlist = document.getElementById("dlist"), dq = document.getElementById("dq");
  var dmsg = document.getElementById("dmsg"), dmonth = document.getElementById("dmonth");
  var delMonth = "", delRows = [], delSeq = 0;
  var ICONS = { "식비": "🍚", "생필품": "🛒", "기타": "📦", "자동차": "🚗", "ETC": "📌" };

  function won(n) { return (n < 0 ? "-" : "") + String(Math.abs(Math.round(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "원"; }
  function setDmsg(text, ok) { dmsg.textContent = text; dmsg.className = ok ? "ok" : ""; }
  function shiftMonth(m, d) {
    var y = Number(m.slice(0, 4)), n = Number(m.slice(5)) - 1 + d;
    y += Math.floor(n / 12); n = ((n % 12) + 12) % 12 + 1;
    return y + "-" + (n < 10 ? "0" : "") + n;
  }
  function showTab(name) {
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) { b.classList.toggle("on", b.dataset.tab === name); });
    form.hidden = name !== "entry"; del.hidden = name !== "del";
    if (name === "del") loadDel(delMonth || params().m || today().slice(0, 7));
  }
  function loadDel(m) {
    delMonth = m;
    dmonth.textContent = Number(m.slice(0, 4)) + "년 " + Number(m.slice(5)) + "월";
    var my = ++delSeq;
    delRows = []; renderDel(); setDmsg("불러오는 중…", true);
    entryPost("list", { month: m }).then(function (r) {
      if (my !== delSeq) return;
      if (!r.ok) { setDmsg(r.code === "SHEET_NOT_FOUND" ? "이 달 시트가 없습니다." : (r.message || r.code)); return; }
      setDmsg("");
      delRows = r.data.rows.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || b.row - a.row; });
      renderDel();
    }).catch(function () { if (my === delSeq) setDmsg("인터넷 연결을 확인해 주세요."); });
  }
  function renderDel() {
    var q = dq.value.trim().toLowerCase();
    dlist.textContent = "";
    var rows = delRows.filter(function (x) {
      return !q || [x.item, x.payment, x.category, String(x.amount)].join(" ").toLowerCase().indexOf(q) >= 0;
    });
    if (!rows.length && delRows.length) { var e = document.createElement("div"); e.className = "dempty"; e.textContent = "검색 결과가 없습니다."; dlist.appendChild(e); }
    rows.forEach(function (x) {
      var row = document.createElement("div"); row.className = "drow";
      var info = document.createElement("div"); info.className = "info";
      var t = document.createElement("div"); t.className = "t"; t.textContent = (ICONS[x.category] || "") + " " + x.item;
      var s = document.createElement("div"); s.className = "s";
      s.textContent = (x.date ? x.date.slice(5).replace("-", "/") + " · " : "") + x.category + " · " + (x.payment || "-");
      info.appendChild(t); info.appendChild(s);
      var a = document.createElement("div"); a.className = "a"; a.textContent = won(x.amount);
      var b = document.createElement("button"); b.type = "button"; b.textContent = "삭제";
      b.onclick = function () { deleteRow(x, b); };
      row.appendChild(info); row.appendChild(a); row.appendChild(b);
      dlist.appendChild(row);
    });
  }
  function deleteRow(x, btn) {
    if (busy) return;
    if (!confirm(x.category + " / " + x.item + " / " + won(x.amount) + (x.date ? " (" + x.date + ")" : "") + "\n\n시트에서 삭제할까요? 되돌릴 수 없습니다.")) return;
    busy = true; btn.disabled = true; btn.textContent = "삭제 중…";
    entryPost("delete", { month: delMonth, category: x.category, row: x.row, date: x.date, item: x.item, amount: x.amount, payment: x.payment })
      .then(function (r) {
        if (r.ok) {
          delRows = delRows.filter(function (y) { return y !== x; });
          renderDel();
          setDmsg((r.code === "ALREADY_DELETED" ? "이미 비어 있던 행입니다 · " : "삭제 완료 · ") + x.item + " " + won(x.amount), true);
          load(true);
        } else if (r.code === "CHANGED") {
          setDmsg(r.message); loadDel(delMonth);
        } else {
          setDmsg(r.code === "DENIED" ? "등록 키가 맞지 않습니다." : (r.message || r.code));
        }
      })
      .catch(function () { setDmsg("응답을 받지 못했습니다. 목록을 다시 불러와 확인하세요."); loadDel(delMonth); })
      .then(function () { busy = false; btn.disabled = false; btn.textContent = "삭제"; });
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) { b.onclick = function () { showTab(b.dataset.tab); }; });
  document.getElementById("dprev").onclick = function () { loadDel(shiftMonth(delMonth, -1)); };
  document.getElementById("dnext").onclick = function () { loadDel(shiftMonth(delMonth, 1)); };
  dq.addEventListener("input", renderDel);

  fab.onclick = function () { delMonth = ""; showTab("entry"); openEntry(); };
  document.getElementById("close").onclick = closeEntry;
  sheet.addEventListener("click", function (ev) { if (ev.target === sheet) closeEntry(); });
  fAmount.addEventListener("input", function () {
    var n = fAmount.value.replace(/[^\d]/g, "").replace(/^0+/, "");
    fAmount.value = n.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  });
  // 입력을 바꾸면 다른 거래 → 새 txId (같은 내용 재시도만 같은 txId 로 보내 중복 기록을 막는다)
  form.addEventListener("input", function () { txId = newTxId(); });
  cats.addEventListener("click", function () { txId = newTxId(); });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (busy) return;
    var amount = Number(fAmount.value.replace(/[^\d]/g, ""));
    if (!entryCat) return setMsg("카테고리를 고르세요.");
    if (!fItem.value.trim()) return setMsg("품목을 입력하세요.");
    if (!amount) return setMsg("금액을 입력하세요.");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fDate.value)) return setMsg("날짜를 고르세요.");
    busy = true; saveBtn.disabled = true; saveBtn.textContent = "등록 중…"; setMsg("");
    entryPost("save", {
      txId: txId, category: entryCat, item: fItem.value.trim(), amount: amount,
      payment: fPay.value, date: fDate.value.replace(/-/g, "")
    }).then(function (r) {
      if (r.ok) {
        var d = r.data || {};
        setMsg((r.code === "DUPLICATE" ? "이미 등록된 건입니다 · " : "등록 완료 · ") + (d.sheet || "") + (d.row ? " " + d.row + "행" : ""), true);
        txId = "";
        setTimeout(function () { sheet.className = ""; }, 900);
        var p = params(), m = fDate.value.slice(0, 7);
        if (p.m && p.m !== m) { p.m = m; location.hash = hashOf(p); } else load(true);
      } else if (r.code === "DENIED") {
        setMsg("등록 키가 맞지 않습니다. 등록 주소로 다시 열어 주세요.");
      } else {
        // 입력 오류는 고쳐서 다시 보내도 같은 txId (기록되지 않았으므로 안전)
        setMsg(r.message || r.code);
      }
    }).catch(function (err) {
      // 응답을 못 받음 → 기록됐을 수도 있다. 같은 txId 로 다시 누르면 DUPLICATE 로 확인된다
      setMsg("응답을 받지 못했습니다. 다시 누르면 중복 없이 확인합니다. (" + err.message + ")");
    }).then(function () {
      busy = false; saveBtn.disabled = false; saveBtn.textContent = "등록";
    });
  });

  window.addEventListener("hashchange", function () { load(false); });
  // 홈 화면에서 다시 열었을 때 최신 값으로 (화면은 그대로 두고 값만 교체)
  document.addEventListener("visibilitychange", function () { if (!document.hidden && main.firstChild) load(true); });
  load(false);
})();
</script>
</body>
</html>
